<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="Screen">
        <div class="SideBar">
            <div class="Pages">

                <div class="Logo">
                    <img src="images/e2logo.png" alt="e2logo">
                </div>
                <a href="index.html">
                    <div class="Dashboard">
                        <img src="images/excel.svg" alt="e2logo">
                        <p>Dashboard</p>
                    </div>
                </a>
                <a href="schedule.html">
                    <div class="NewSchedule">
                        <img src="images/table.svg" alt="e2logo">
                        <p>Schedules</p>
                    </div>
                </a>

            </div>

        </div>
        <div class="MainView">
            <div class="MainBox">
                <div id="box-title">
                    <h2>Schedules</h2>
                    <a href="upload.html" id="upload-new">
                        <p>+ Upload Sheet</p>
                    </a>
                </div>
                <div id="schedule-entry">
                    <div id="schedule-header">
                        <p>NAME</p>
                        <p>PROJECT</p>
                        <p>CREATED</p>
                    </div>
                    <div id="display-schedule">
                    </div>
                </div>
            </div>
            <div class="add_schedule overlay hidden" id="overlay">
                <div class="popup" id="popup">
                    <div class="popup_header">
                        <div class="popup_header_entry">
                            <p>NAME</p>
                        </div>
                        <div class="popup_header_entry">
                            <p>PROJECT</p>
                        </div>
                        <div class="popup_header_entry">
                            <p>CREATED</p>
                        </div>
                    </div>
                    <div id="popup-body">
                        <div class="sched_entry">
                                <input type="text" id="sched_name">
                            </div>
                            <div class="sched_entry">
                                <input type="text" id="sched_project">
                            </div>
                            <div class="sched_entry">
                                <div id="sched_created">

                                </div>
                            </div>
                    </div>
                    <div class="popup-buttons">
                            <button class="exit_button">Exit</button>
                            <button id="add_button">Add to Schedule</button>
                    </div>
                </div>
                <div class="schedule_popup" id="schedule_popup">
                    <div class="popup_header">
                        <div class="popup_header_entry">
                            <p>NAME</p>
                        </div>
                        <div class="popup_header_entry">
                            <p>PROJECT</p>
                        </div>
                        <div class="popup_header_entry">
                            <p>CREATED</p>
                        </div>
                    </div>
                    <div id="popup-body">
                        
                    </div>
                    <div class="popup-buttons">
                            <button class="exit_button">Exit</button>
                            <button id="add_button">Add to Schedule</button>
                    </div>
                </div>
            </div>
            <div class="ButtonBox">
                <button id="add_schedule_button">New Schedule</button>
                <button id="open_button">Open</button>
            </div>
        </div>
    </div>
    <script src="action2.js"></script>
</body>
</html>
